name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Build & Smoke (Go 1.27)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Show toolchain
        run: |
          go version
          go env GOOS GOARCH GOPATH

      - name: Download Go modules
        run: go mod download

      - name: Build (cmd/pigasus)
        run: go build -o /tmp/pigasus ./cmd/pigasus

      # The other entry points (openagy-models, openai-shim, anthropic-shim)
      # are compiled but not shipped in the release archive; a broken one must
      # still fail CI.
      - name: Build (every cmd)
        run: go build ./cmd/...

      - name: Show built binary size
        run: |
          ls -la /tmp/pigasus
          file /tmp/pigasus

      - name: Architecture Layering Guard
        run: go test -v ./internal/core/architecture/...

      - name: Smoke test (--version)
        run: /tmp/pigasus --version

      - name: Smoke test (--help)
        run: |
          /tmp/pigasus --help 2>&1 | head -20
          /tmp/pigasus --help 2>&1 | sed -n '/^Available subcommands:/,$p' | tail -n +2 | awk '{print $1}' | sort > /tmp/subs_got.txt
          printf 'accounts\nacp\nagent\nagent-server\nagents\nchangelog\nhalloween\nhelp\ninstall\nmcp\nmic-serve\nmodel\nmodels\nplugin\nplugins\nprovider\nproxy\nremote-control\nserver\ntui\nupdate\nweb\n' | sort > /tmp/subs_want.txt
          diff -u /tmp/subs_want.txt /tmp/subs_got.txt

      - name: Smoke test (proxy admin)
        run: /tmp/pigasus proxy version

      - name: Smoke test (provider registry)
        run: /tmp/pigasus provider list

      - name: Smoke test (model registry)
        run: /tmp/pigasus model list

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "cmd & public packages"
            packages: "./cmd/... ./endpoints/... ./configdir/... ./render/... ./diffsyntax/... ./palette/... ./retry/... ./retrybudget/... ./procgroup/... ./browsercdp/... ./celpolicy/... ./dns/... ./rcmesh/... ./remotetransport/... ./rcterminal/... ./urlchunk/... ./geminicode/... ./accountpool/... ./agentlink/... ./localharness/..."
          - name: "core"
            packages: "./internal/core/..."
          - name: "features"
            packages: "./internal/features/..."
          - name: "infra"
            packages: "./internal/infra/..."
          - name: "app"
            packages: "./internal/app/..."
          - name: "ui"
            packages: "./internal/ui/..."
          - name: "entry-hosts"
            packages: "./internal/printmode/... ./internal/cli/... ./internal/clirunner/... ./internal/modular/... ./internal/cortex/... ./internal/lsserver/... ./internal/agyupdate/... ./internal/voice/... ./internal/language_server/... ./internal/planrender/..."
          - name: "remote-control"
            packages: "./internal/remotecontrol/... ./internal/rchost/... ./internal/rcaudio/... ./internal/rcfrontend/... ./internal/rctunnel/..."
          - name: "tui"
            packages: "./internal/tui/..."
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Run Package Tests
        run: go test -count=1 -timeout 10m ${{ matrix.packages }}

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      # The race detector over the packages that own goroutines
      - name: Test race detector (goroutine-owning packages)
        run: |
          go test -count=1 -race \
            ./internal/app/subagent/... \
            ./internal/app/subagenttools/... \
            ./internal/app/tools/... \
            ./internal/features/tools/... \
            ./internal/features/plugins/watch/... \
            ./internal/features/auth/... \
            ./internal/rchost/... \
            ./internal/tui/stream/...
